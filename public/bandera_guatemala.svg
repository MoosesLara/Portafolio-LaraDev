<svg viewBox="0 0 512 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="flagShape">
      <path d="M10,70 C90,40 170,40 250,65 C330,90 410,90 502,55 L502,345 C410,375 330,375 250,350 C170,325 90,325 10,355 Z"/>
    </clipPath>
    <linearGradient id="foldShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <g clip-path="url(#flagShape)">
      <rect x="0" y="0" width="176" height="400" fill="#4997D0"/>
      <rect x="176" y="0" width="160" height="400" fill="#FFFFFF"/>
      <rect x="336" y="0" width="176" height="400" fill="#4997D0"/>

      <g transform="translate(256,200)">
        <path d="M-55,-10 C-70,10 -65,45 -35,58 C-20,64 -5,64 0,60" fill="none" stroke="#3f8f3f" stroke-width="9" stroke-linecap="round"/>
        <path d="M55,-10 C70,10 65,45 35,58 C20,64 5,64 0,60" fill="none" stroke="#3f8f3f" stroke-width="9" stroke-linecap="round"/>
        <circle cx="-45" cy="20" r="4" fill="#b5432e"/>
        <circle cx="-30" cy="45" r="4" fill="#b5432e"/>
        <circle cx="45" cy="20" r="4" fill="#b5432e"/>
        <circle cx="30" cy="45" r="4" fill="#b5432e"/>

        <line x1="-45" y1="35" x2="45" y2="-35" stroke="#7a7a7a" stroke-width="4"/>
        <line x1="45" y1="35" x2="-45" y2="-35" stroke="#7a7a7a" stroke-width="4"/>

        <rect x="-42" y="-14" width="84" height="30" rx="4" fill="#f0d97a" stroke="#b89b3f" stroke-width="2"/>
        <line x1="-32" y1="-5" x2="32" y2="-5" stroke="#8a7328" stroke-width="2"/>
        <line x1="-32" y1="3" x2="32" y2="3" stroke="#8a7328" stroke-width="2"/>
        <line x1="-32" y1="11" x2="32" y2="11" stroke="#8a7328" stroke-width="2"/>

        <g transform="translate(0,-38)">
          <ellipse cx="0" cy="0" rx="14" ry="10" fill="#2e8b57"/>
          <circle cx="9" cy="-4" r="6" fill="#2e8b57"/>
          <path d="M9,-4 L18,-3 L9,0 Z" fill="#e0b23a"/>
          <path d="M-10,2 C-25,6 -30,20 -22,26 C-16,20 -12,10 -6,4 Z" fill="#2e8b57"/>
          <ellipse cx="1" cy="4" rx="6" ry="4" fill="#c0392b"/>
        </g>
      </g>

      <rect x="0" y="0" width="512" height="400" fill="url(#foldShade)"/>
    </g>

    <path d="M10,70 C90,40 170,40 250,65 C330,90 410,90 502,55 L502,345 C410,375 330,375 250,350 C170,325 90,325 10,355 Z"
