<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LaraDev</title>
    <script type="text/javascript">
      // Truco para SPAs en GitHub Pages (rutas de React Router sin servidor).
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1 // mantiene "/Portafolio-LaraDev"

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
